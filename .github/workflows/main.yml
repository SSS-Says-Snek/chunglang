name: GitHub Actions Demo
run-name: Test Chunglang program output
on: [push]
jobs:
  test-programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.8
        with:
          version: "21.1.3"
      - name: Symlink LLVM
        run: |
          ls
          sudo ln -s libLLVM.so.21.1 /lib/libLLVM-21.so
        working-directory: ${{ env.LLVM_PATH }}/lib
      - name: Install Apt Packages
        run: sudo apt install -y build-essential libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DINSTALL_RAYLIB=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          version: "3.10"
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run Tests
        run: pytest
