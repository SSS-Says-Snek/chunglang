name: GitHub Actions Demo
run-name: Test Chunglang program output
on: [push]
jobs:
  test-programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.8
        with:
          version: "21.1.3"
      - name: Symlink LLVM
        run: |
          ls
          sudo ln -s libLLVMIRReader.a /lib/x86_64-linux-gnu/libLLVMIRReader.a
          sudo ln -s libLLVMSupport.a /lib/x86_64-linux-gnu/libLLVMSupport.a
          sudo ln -s libLLVMCore.a /lib/x86_64-linux-gnu/libLLVMCore.a
          echo "Done, lsing /lib/x86_64-linux-gnu.."
          ls /lib/x86_64-linux-gnu
        working-directory: ${{ env.LLVM_PATH }}/lib
      - name: Install Apt Packages
        run: sudo apt install -y build-essential libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DINSTALL_RAYLIB=ON -DIS_GITHUB_ACTIONS=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          version: "3.10"
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run Tests
        run: pytest
